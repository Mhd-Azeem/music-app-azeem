name: Apply Email Activation Settings Button

on:
  push:
    branches:
      - feature/email-activation-access
    paths:
      - .github/scripts/move_email_activation_button.py
      - .github/workflows/apply-email-activation-settings-button.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Move activation button into Settings
        run: python .github/scripts/move_email_activation_button.py

      - name: Verify placement and floating removal
        run: |
          grep -n 'onEmailActivationClick' app/src/main/java/com/wavelength/music/ui/settings/SettingsScreen.kt
          grep -n 'Text("Email Activation")\|text = "Email Activation"' app/src/main/java/com/wavelength/music/ui/settings/SettingsScreen.kt
          ! grep -n 'Modifier.align(Alignment.BottomEnd).*Email Activation' app/src/main/java/com/wavelength/music/ui/navigation/NavGraph.kt

      - name: Commit app changes and clean helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/move_email_activation_button.py .github/workflows/apply-email-activation-settings-button.yml
          git add app/src/main/java/com/wavelength/music/ui/settings/SettingsScreen.kt app/src/main/java/com/wavelength/music/ui/navigation/NavGraph.kt
          git commit -m "feat: move email activation into settings list"
          git push origin HEAD:feature/email-activation-access
