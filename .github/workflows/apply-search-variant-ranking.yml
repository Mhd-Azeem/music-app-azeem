name: Apply Search Variant Ranking

on:
  push:
    branches: [feature/email-activation-access]
    paths:
      - '.github/search-variant-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply search ranking fix
        run: python .github/scripts/fix-search-variant-ranking.py
      - name: Verify search logic
        run: |
          grep -q 'baseTitleQuery' app/src/main/java/com/wavelength/music/ui/search/SearchViewModel.kt
          grep -q 'variantSignature' app/src/main/java/com/wavelength/music/ui/search/SearchViewModel.kt
          grep -q 'Search now prioritizes the exact song title' app/src/main/java/com/wavelength/music/ui/settings/AboutSheet.kt
      - name: Commit app changes and clean helper files
        run: |
          rm -f .github/workflows/apply-search-variant-ranking.yml .github/search-variant-trigger.txt .github/scripts/fix-search-variant-ranking.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: prioritize exact song variants in search'
          git push origin HEAD:feature/email-activation-access
