name: Apply Glass Queue Separator
on:
  push:
    paths:
      - '.github/glass-queue-separator-trigger.txt'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
      - run: python .github/scripts/refine_glass_queue_separator.py
      - name: Commit and cleanup
        run: |
          rm -f .github/scripts/refine_glass_queue_separator.py .github/workflows/apply_glass_queue_separator.yml .github/glass-queue-separator-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: separate glass queue with circular fan' || exit 0
          git push origin HEAD:feature/email-activation-access
