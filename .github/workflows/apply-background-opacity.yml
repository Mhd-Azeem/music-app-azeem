name: Apply Background Opacity

on:
  push:
    branches: [feature/email-activation-access]
    paths:
      - '.github/background-opacity-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply background opacity UI
        run: python .github/scripts/add_background_opacity.py
      - name: Verify opacity UI and About update
        run: |
          grep -F 'Background opacity:' app/src/main/java/com/wavelength/music/ui/settings/SettingsScreen.kt
          grep -F 'Background opacity slider restored' app/src/main/java/com/wavelength/music/ui/settings/AboutSheet.kt
      - name: Commit app changes and clean helper files
        run: |
          rm -f .github/scripts/add_background_opacity.py .github/workflows/apply-background-opacity.yml .github/background-opacity-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: restore background opacity slider and update About' || exit 0
          git push origin HEAD:feature/email-activation-access
