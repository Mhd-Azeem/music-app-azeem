name: Apply Auto Updater Fix
on:
  push:
    paths:
      - '.github/auto-updater-fix-trigger.txt'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
      - run: python .github/scripts/fix_auto_updater.py
      - name: Commit and cleanup
        run: |
          rm -f .github/scripts/fix_auto_updater.py .github/workflows/apply_auto_updater_fix.yml .github/auto-updater-fix-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore reliable auto updater detection' || exit 0
          git push origin HEAD:feature/email-activation-access
