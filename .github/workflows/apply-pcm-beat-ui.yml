name: Apply PCM Beat UI

on:
  push:
    branches:
      - feature/email-activation-access
    paths:
      - .github/pcm-beat-ui-trigger.txt

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/email-activation-access
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Replace Visualizer beat UI with decoded PCM beat events
        run: python .github/scripts/apply_pcm_beat_ui.py
      - name: Commit final PCM beat implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/apply_pcm_beat_ui.py .github/workflows/apply-pcm-beat-ui.yml .github/pcm-beat-ui-trigger.txt
          git add -A
          git commit -m "fix: drive beat bounce from decoded ExoPlayer PCM"
          git push origin HEAD:feature/email-activation-access
      - name: Build exact patched branch head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-apk.yml --repo "$GITHUB_REPOSITORY" --ref feature/email-activation-access
