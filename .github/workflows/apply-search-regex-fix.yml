name: Apply Search Regex Fix

on:
  push:
    branches:
      - feature/email-activation-access
    paths:
      - .github/workflows/apply-search-regex-fix.yml
      - .github/scripts/fix-search-regex.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fix search regex and About
        run: python .github/scripts/fix-search-regex.py
      - name: Verify bad escapes removed
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path('app/src/main/java/com/wavelength/music/ui/search/SearchViewModel.kt').read_text()
          assert 'Regex("\\s+")' not in t
          assert 'Regex("\\bslowed\\b")' not in t
          assert 'Regex("""\\bslowed\\b""")' in t
          PY
      - name: Commit fixed app source
        run: |
          rm -f .github/workflows/apply-search-regex-fix.yml .github/scripts/fix-search-regex.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: correct regex escapes in exact variant search'
          git push origin HEAD:feature/email-activation-access
