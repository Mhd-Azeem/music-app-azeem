name: Apply Full Glass Theme

on:
  push:
    paths:
      - '.github/scripts/apply_full_glass_theme.py'
      - '.github/workflows/apply_full_glass_theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/apply_full_glass_theme.py
      - name: Commit source changes and clean helper files
        run: |
          rm -f .github/scripts/apply_full_glass_theme.py .github/workflows/apply_full_glass_theme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: make glassmorphism a full-app theme' || exit 0
          git push origin HEAD:feature/email-activation-access
