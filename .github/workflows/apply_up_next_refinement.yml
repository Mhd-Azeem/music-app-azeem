name: Apply Up Next Refinement
on:
  push:
    paths:
      - '.github/up-next-refinement-trigger.txt'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
      - name: Apply patch
        run: python .github/scripts/refine_up_next.py
      - name: Commit source changes and cleanup
        run: |
          rm -f .github/scripts/refine_up_next.py .github/workflows/apply_up_next_refinement.yml .github/up-next-refinement-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: refine curved borderless Up Next' || exit 0
          git push origin HEAD:feature/email-activation-access
