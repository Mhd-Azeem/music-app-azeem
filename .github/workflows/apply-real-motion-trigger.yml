name: Apply Real Album Motion Trigger

on:
  push:
    branches:
      - feature/email-activation-access
    paths:
      - .github/real-motion-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/email-activation-access
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply real motion patch
        run: python .github/scripts/apply_real_motion.py
      - name: Commit app source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/wavelength/music/ui/nowplaying/NowPlayingScreen.kt
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "feat: make parallax sensor-driven and beat bounce audio-reactive"
          git push origin HEAD:feature/email-activation-access
