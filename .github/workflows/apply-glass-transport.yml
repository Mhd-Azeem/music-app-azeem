name: Apply Glass Transport Controls

on:
  push:
    paths:
      - '.github/scripts/apply_glass_transport.py'
      - '.github/workflows/apply-glass-transport.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
          fetch-depth: 0
      - name: Apply transport restyle
        run: python .github/scripts/apply_glass_transport.py
      - name: Commit feature and clean helper files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wavelength/music/ui/nowplaying/NowPlayingScreen.kt app/src/main/java/com/wavelength/music/ui/settings/AboutSheet.kt
          git rm .github/scripts/apply_glass_transport.py .github/workflows/apply-glass-transport.yml
          git commit -m 'feat: match glass playback controls to reference style'
          git push origin feature/email-activation-access
