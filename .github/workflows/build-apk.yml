name: Build APK

on:
  push:
    branches:
      - "feature/email-activation-access"
  workflow_dispatch: {}

concurrency:
  group: azmusic-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Set up JDK 17 with Gradle cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          if [ -n "$JIOSAAVN_BASE_URL" ]; then echo "JIOSAAVN_BASE_URL=${JIOSAAVN_BASE_URL}" >> local.properties; fi
        env:
          JIOSAAVN_BASE_URL: ${{ secrets.JIOSAAVN_BASE_URL }}
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Prepare permanent signing key
        env:
          AZMUSIC_KEYSTORE_BASE64: ${{ secrets.AZMUSIC_KEYSTORE_BASE64 }}
          AZMUSIC_KEYSTORE_PASSWORD: ${{ secrets.AZMUSIC_KEYSTORE_PASSWORD }}
          AZMUSIC_KEY_ALIAS: ${{ secrets.AZMUSIC_KEY_ALIAS }}
          AZMUSIC_KEY_PASSWORD: ${{ secrets.AZMUSIC_KEY_PASSWORD }}
        run: |
          if [ -n "$AZMUSIC_KEYSTORE_BASE64" ]; then
            echo "$AZMUSIC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/azmusic-release.jks"
            echo "AZMUSIC_KEYSTORE_PATH=$RUNNER_TEMP/azmusic-release.jks" >> "$GITHUB_ENV"
            echo "AZMUSIC_KEYSTORE_PASSWORD=$AZMUSIC_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "AZMUSIC_KEY_ALIAS=$AZMUSIC_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "AZMUSIC_KEY_PASSWORD=$AZMUSIC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build AzMusic release
        run: ./gradlew :app:assembleRelease --build-cache --parallel --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-release.apk release-apks/AzMusic.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: azmusic-apk
          path: release-apks/AzMusic.apk
          retention-days: 30
          compression-level: 0
      - name: Verify newest branch commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(gh api repos/$GITHUB_REPOSITORY/commits/feature/email-activation-access --jq .sha)
          test "$HEAD_SHA" = "$GITHUB_SHA" || { echo "Newer commit exists; refusing stale release."; exit 1; }
      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | while read -r asset; do gh release delete-asset latest "$asset" --repo "$GITHUB_REPOSITORY" -y; done || true
      - name: Publish AzMusic APK to Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: AzMusic Latest
          body: |
            Build number: ${{ github.run_number }}
            Automatically rebuilt from commit ${{ github.sha }}.

            `AzMusic.apk` is the production Android app.
          prerelease: false
          make_latest: true
          files: release-apks/AzMusic.apk
