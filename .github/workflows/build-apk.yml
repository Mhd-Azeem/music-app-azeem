name: Build APK

on:
  push:
    branches:
      - "feature/email-activation-access"
    paths-ignore:
      - "preview/**"
      - ".github/workflows/deploy-ui-preview.yml"
  workflow_dispatch: {}

concurrency:
  group: azmusic-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Set up JDK 17 with Gradle cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Apply staged source patch if present
        run: |
          if [ -f .github/scripts/pending_patch.py ]; then
            python .github/scripts/pending_patch.py
            echo "AZMUSIC_PATCH_APPLIED=1" >> "$GITHUB_ENV"
          fi
      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          if [ -n "$JIOSAAVN_BASE_URL" ]; then echo "JIOSAAVN_BASE_URL=${JIOSAAVN_BASE_URL}" >> local.properties; fi
        env:
          JIOSAAVN_BASE_URL: ${{ secrets.JIOSAAVN_BASE_URL }}
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Prepare permanent signing key
        env:
          AZMUSIC_KEYSTORE_BASE64: ${{ secrets.AZMUSIC_KEYSTORE_BASE64 }}
          AZMUSIC_KEYSTORE_PASSWORD: ${{ secrets.AZMUSIC_KEYSTORE_PASSWORD }}
          AZMUSIC_KEY_ALIAS: ${{ secrets.AZMUSIC_KEY_ALIAS }}
          AZMUSIC_KEY_PASSWORD: ${{ secrets.AZMUSIC_KEY_PASSWORD }}
        run: |
          if [ -z "$AZMUSIC_KEYSTORE_BASE64" ] || [ -z "$AZMUSIC_KEYSTORE_PASSWORD" ] || [ -z "$AZMUSIC_KEY_ALIAS" ] || [ -z "$AZMUSIC_KEY_PASSWORD" ]; then
            echo "::error::Production signing is required to publish an in-app update."
            exit 1
          fi
          echo "$AZMUSIC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/azmusic-release.jks"
          echo "AZMUSIC_KEYSTORE_PATH=$RUNNER_TEMP/azmusic-release.jks" >> "$GITHUB_ENV"
      - name: Build AzMusic release
        env:
          AZMUSIC_KEYSTORE_PASSWORD: ${{ secrets.AZMUSIC_KEYSTORE_PASSWORD }}
          AZMUSIC_KEY_ALIAS: ${{ secrets.AZMUSIC_KEY_ALIAS }}
          AZMUSIC_KEY_PASSWORD: ${{ secrets.AZMUSIC_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lint :app:assembleRelease --build-cache --parallel --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-release.apk release-apks/AzMusic.apk
      - name: Verify this APK upgrades the published app
        id: apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download latest --pattern AzMusic.apk --dir "$RUNNER_TEMP"
          tools="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f -printf '%h\n' | sort -V | tail -1)"
          certificate() {
            "$tools/apksigner" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          }
          version_code() {
            "$tools/aapt" dump badging "$1" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p"
          }
          previous="$RUNNER_TEMP/AzMusic.apk"
          candidate="release-apks/AzMusic.apk"
          previous_cert="$(certificate "$previous")"
          candidate_cert="$(certificate "$candidate")"
          previous_code="$(version_code "$previous")"
          candidate_code="$(version_code "$candidate")"
          test -n "$previous_cert" && test "$previous_cert" = "$candidate_cert"
          test -n "$previous_code" && test -n "$candidate_code" && test "$candidate_code" -gt "$previous_code"
          echo "version_code=$candidate_code" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: azmusic-apk
          path: release-apks/AzMusic.apk
          retention-days: 30
          compression-level: 0
      - name: Publish AzMusic APK to Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: AzMusic Latest
          body: |
            Build number: ${{ steps.apk.outputs.version_code }}
            Automatically rebuilt from commit ${{ github.sha }}.

            `AzMusic.apk` is the production Android app.
          prerelease: false
          make_latest: true
          files: release-apks/AzMusic.apk
      - name: Persist staged patch and clean staging file
        if: env.AZMUSIC_PATCH_APPLIED == '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/pending_patch.py
          git add app/src/main/java/com/wavelength/music/ui/nowplaying/NowPlayingScreen.kt \
                  app/src/main/java/com/wavelength/music/ui/nowplaying/PlayerViewModel.kt \
                  app/src/main/java/com/wavelength/music/playback/PlayerController.kt \
                  app/src/main/java/com/wavelength/music/playback/PlaybackService.kt \
                  app/src/main/java/com/wavelength/music/ui/settings/AboutSheet.kt \
                  app/src/main/java/com/wavelength/music/ui/settings/SettingsScreen.kt \
                  app/src/main/java/com/wavelength/music/ui/settings/AppSettingsViewModel.kt \
                  app/src/main/java/com/wavelength/music/data/repository/SettingsRepository.kt \
                  app/src/main/java/com/wavelength/music/ui/navigation/NavGraph.kt \
                  app/src/main/java/com/wavelength/music/ui/home/HomeScreen.kt \
                  app/src/main/java/com/wavelength/music/ui/navigation/NavGraph.kt \
                  app/src/main/java/com/wavelength/music/ui/components/MiniPlayerBar.kt \
                  app/src/main/java/com/wavelength/music/ui/components/TrackOptionsSheet.kt \
                  app/src/main/java/com/wavelength/music/ui/search/SearchScreen.kt \
                  app/src/main/java/com/wavelength/music/ui/components/TrackListScreen.kt \
                  app/src/main/java/com/wavelength/music/ui/home/GenreScreen.kt \
                  app/src/main/java/com/wavelength/music/ui/home/GenreViewModel.kt \
                  app/src/main/java/com/wavelength/music/ui/playlist/PlaylistDetailScreen.kt \
                  app/src/main/java/com/wavelength/music/ui/playlist/PlaylistDetailViewModel.kt \
                  app/src/main/java/com/wavelength/music/ui/design/UiDesignConfig.kt \
                  app/src/main/java/com/wavelength/music/MainActivity.kt \
                  app/src/main/java/com/wavelength/music/ui/theme/Theme.kt
          git commit -m 'feat: persist staged AzMusic UI settings update'
          git fetch origin feature/email-activation-access
          git rebase origin/feature/email-activation-access
          git push origin HEAD:feature/email-activation-access
