name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Write local.properties
        # JIOSAAVN_BASE_URL can be overridden by adding a repository secret with that name.
        # Left unset, the app falls back to its default JioSaavn deployment (see
        # app/build.gradle.kts), so CI builds work without any secret configured.
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          if [ -n "$JIOSAAVN_BASE_URL" ]; then
            echo "JIOSAAVN_BASE_URL=${JIOSAAVN_BASE_URL}" >> local.properties
          fi
        env:
          JIOSAAVN_BASE_URL: ${{ secrets.JIOSAAVN_BASE_URL }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename release APK
        # GitHub's release-asset upload strips/mangles apostrophes and spaces (they silently
        # become dots), so this avoids both rather than shipping a filename that looks different
        # once actually downloaded.
        run: |
          mkdir -p app/build/outputs/apk/release/renamed
          cp "app/build/outputs/apk/release/app-release.apk" "app/build/outputs/apk/release/renamed/AzMusic.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: azmusic-apk
          path: app/build/outputs/apk/release/renamed/AzMusic.apk
          retention-days: 30

      - name: Remove stale release assets
        # softprops/action-gh-release only overwrites assets that share the new upload's exact
        # filename — it never deletes ones left behind by a prior naming scheme — so this clears
        # every existing asset on the "latest" release before each publish, keeping it to just the
        # current build's APK instead of accumulating old copies under old names.
        if: github.ref == 'refs/heads/feature/email-activation-access'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | \
            while read -r asset; do
              gh release delete-asset latest "$asset" --repo "$GITHUB_REPOSITORY" -y
            done || true

      - name: Publish to Releases
        if: github.ref == 'refs/heads/feature/email-activation-access'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: AzMusic Latest
          body: |
            Automatically rebuilt from commit ${{ github.sha }}.

            This is a minified, optimized release build (not from the Play Store) — download
            `AzMusic.apk` below and install it directly (you'll need to allow "install
            unknown apps" for whichever app you use to open it).
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/release/renamed/AzMusic.apk
