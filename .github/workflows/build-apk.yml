name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          if [ -n "$JIOSAAVN_BASE_URL" ]; then echo "JIOSAAVN_BASE_URL=${JIOSAAVN_BASE_URL}" >> local.properties; fi
        env:
          JIOSAAVN_BASE_URL: ${{ secrets.JIOSAAVN_BASE_URL }}
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Prepare permanent signing key
        env:
          AZMUSIC_KEYSTORE_BASE64: ${{ secrets.AZMUSIC_KEYSTORE_BASE64 }}
          AZMUSIC_KEYSTORE_PASSWORD: ${{ secrets.AZMUSIC_KEYSTORE_PASSWORD }}
          AZMUSIC_KEY_ALIAS: ${{ secrets.AZMUSIC_KEY_ALIAS }}
          AZMUSIC_KEY_PASSWORD: ${{ secrets.AZMUSIC_KEY_PASSWORD }}
        run: |
          if [ -n "$AZMUSIC_KEYSTORE_BASE64" ]; then
            echo "$AZMUSIC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/azmusic-release.jks"
            echo "AZMUSIC_KEYSTORE_PATH=$RUNNER_TEMP/azmusic-release.jks" >> "$GITHUB_ENV"
            echo "AZMUSIC_KEYSTORE_PASSWORD=$AZMUSIC_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "AZMUSIC_KEY_ALIAS=$AZMUSIC_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "AZMUSIC_KEY_PASSWORD=$AZMUSIC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build original and Sinhala demo
        run: ./gradlew :app:assembleRelease :sarigama-demo:assembleRelease --stacktrace
      - name: Rename APKs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-release.apk release-apks/AzMusic.apk
          cp sarigama-demo/build/outputs/apk/release/sarigama-demo-release.apk release-apks/AzMusic-Sinhala-Sarigama-Demo.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: azmusic-apks
          path: release-apks/*.apk
          retention-days: 30
      - name: Remove stale release assets
        if: github.ref == 'refs/heads/feature/email-activation-access'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | while read -r asset; do gh release delete-asset latest "$asset" --repo "$GITHUB_REPOSITORY" -y; done || true
      - name: Publish both APKs to Releases
        if: github.ref == 'refs/heads/feature/email-activation-access'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: AzMusic Latest
          body: |
            Automatically rebuilt from commit ${{ github.sha }}.

            `AzMusic.apk` is the normal app.
            `AzMusic-Sinhala-Sarigama-Demo.apk` is an isolated test build with a different application ID, so it can be installed alongside AzMusic. It contains only Home, Search and Now Playing and embeds Sarigama to test Sinhala catalogue/search/playback compatibility without changing the production app.
          prerelease: false
          make_latest: true
          files: |
            release-apks/AzMusic.apk
            release-apks/AzMusic-Sinhala-Sarigama-Demo.apk
