name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write local.properties
        # JIOSAAVN_BASE_URL can be overridden by adding a repository secret with that name.
        # Left unset, the app falls back to its default JioSaavn deployment (see
        # app/build.gradle.kts), so CI builds work without any secret configured.
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          if [ -n "$JIOSAAVN_BASE_URL" ]; then
            echo "JIOSAAVN_BASE_URL=${JIOSAAVN_BASE_URL}" >> local.properties
          fi
        env:
          JIOSAAVN_BASE_URL: ${{ secrets.JIOSAAVN_BASE_URL }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavelength-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish to Releases
        if: github.ref == 'refs/heads/claude/wavelength-music-app-hm1q2a'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatically rebuilt from commit ${{ github.sha }}.

            This is a minified, optimized release build (not from the Play Store) — download
            `app-release.apk` below and install it directly (you'll need to allow "install unknown
            apps" for whichever app you use to open it).
          prerelease: true
          make_latest: true
          files: app/build/outputs/apk/release/app-release.apk
