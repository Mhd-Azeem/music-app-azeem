name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write local.properties
        # JAMENDO_CLIENT_ID can be overridden by adding a repository secret with that name.
        # Falls back to the free demo client ID used throughout this project's README.
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "JAMENDO_CLIENT_ID=${JAMENDO_CLIENT_ID:-d18642e1}" >> local.properties
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavelength-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish to Releases
        if: github.ref == 'refs/heads/claude/wavelength-music-app-hm1q2a'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatically rebuilt from commit ${{ github.sha }}.

            This is a debug APK — download `app-debug.apk` below and install it directly
            (you'll need to allow "install unknown apps" for whichever app you use to open it).
          prerelease: true
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
