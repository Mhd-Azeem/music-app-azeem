name: Apply Glass Separator
on:
  push:
    paths: ['.github/glass-separator-trigger.txt']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
      - run: python .github/scripts/fix_glass_separator.py
      - name: Commit and cleanup
        run: |
          rm -f .github/scripts/fix_glass_separator.py .github/workflows/apply_glass_separator.yml .github/glass-separator-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add curved glass separator and circular Up Next' || exit 0
          git push origin HEAD:feature/email-activation-access
