name: Apply Exact Glass Refinement

on:
  push:
    branches:
      - feature/email-activation-access
    paths:
      - '.github/scripts/refine-glass-exact.py'
      - '.github/workflows/apply-exact-glass-refinement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
          fetch-depth: 0
      - name: Apply exact glass patch
        run: python .github/scripts/refine-glass-exact.py
      - name: Commit source changes and clean helper files
        run: |
          rm -f .github/scripts/refine-glass-exact.py .github/workflows/apply-exact-glass-refinement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: match glass Now Playing closer to reference"
          git push origin feature/email-activation-access
