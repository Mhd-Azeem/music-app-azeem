name: Apply Glass Geometry Once
on:
  push:
    paths: ['.github/glass-geometry-once-trigger.txt']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/email-activation-access
      - run: python .github/scripts/fix_glass_geometry_final.py
      - name: Commit and self-clean
        run: |
          rm -f .github/scripts/fix_glass_geometry_final.py .github/workflows/apply_glass_geometry_once.yml .github/glass-geometry-once-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: correct glass now playing geometry'
          git push origin HEAD:feature/email-activation-access
