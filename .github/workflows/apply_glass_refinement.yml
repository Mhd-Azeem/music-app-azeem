name: Apply Glass Refinement
on:
  push:
    paths:
      - '.github/glass-refinement-trigger.txt'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
      - name: Apply UI refinement
        run: python .github/scripts/refine_glass_ui.py
      - name: Commit refined glass UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wavelength/music/ui/nowplaying/NowPlayingScreen.kt app/src/main/java/com/wavelength/music/ui/navigation/NavGraph.kt app/src/main/java/com/wavelength/music/ui/theme/Theme.kt app/src/main/java/com/wavelength/music/ui/settings/AboutSheet.kt
          git commit -m 'feat: refine full-app liquid glass interface'
          git push origin HEAD:feature/email-activation-access
      - name: Clean helper files
        run: |
          git pull --rebase origin feature/email-activation-access
          git rm .github/scripts/refine_glass_ui.py .github/workflows/apply_glass_refinement.yml .github/glass-refinement-trigger.txt
          git commit -m 'chore: remove glass refinement helper'
          git push origin HEAD:feature/email-activation-access