name: Apply Queue Motion Once
on:
  push:
    paths: ['.github/queue-motion-once-trigger.txt']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/email-activation-access
      - run: python .github/scripts/fix_queue_motion_alignment.py
      - name: Commit and self-clean
        run: |
          rm -f .github/scripts/fix_queue_motion_alignment.py .github/workflows/apply_queue_motion_once.yml .github/queue-motion-once-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make Up Next fan motion continuous and align separator'
          git push origin HEAD:feature/email-activation-access
