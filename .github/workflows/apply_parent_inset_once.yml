name: Apply Parent Inset Once
on:
  push:
    paths: ['.github/parent-inset-once-trigger.txt']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/email-activation-access
      - run: python .github/scripts/fix_glass_parent_inset.py
      - name: Commit and self-clean
        run: |
          rm -f .github/scripts/fix_glass_parent_inset.py .github/workflows/apply_parent_inset_once.yml .github/parent-inset-once-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove inherited glass now playing horizontal inset'
          git push origin HEAD:feature/email-activation-access
