name: Apply Compact Global Theme Color

on:
  push:
    branches:
      - feature/email-activation-access
    paths:
      - .github/scripts/apply_theme_color_compact.py
      - .github/workflows/apply-theme-color-compact.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply settings and theme patch
        run: python .github/scripts/apply_theme_color_compact.py

      - name: Verify requested UI changes
        run: |
          grep -q 'SettingsSection(title = "Theme Accent Color")' app/src/main/java/com/wavelength/music/ui/settings/SettingsScreen.kt
          ! grep -q 'SettingsSection(title = "Liquid Theme Color")' app/src/main/java/com/wavelength/music/ui/settings/SettingsScreen.kt
          ! grep -q 'Song cover as Liquid background' app/src/main/java/com/wavelength/music/ui/settings/SettingsScreen.kt
          grep -q 'colorScheme = schemeFor(theme, customLiquidAccent)' app/src/main/java/com/wavelength/music/ui/theme/Theme.kt
          grep -q 'liquidAlbumArtBackground = false' app/src/main/java/com/wavelength/music/ui/navigation/NavGraph.kt

      - name: Commit app changes and clean temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_theme_color_compact.py .github/workflows/apply-theme-color-compact.yml
          git add app/src/main/java
          git commit -m "feat: compact global theme color picker and remove liquid cover toggle"
          git push origin HEAD:feature/email-activation-access
