name: Apply Physical Album Motion Engine

on:
  push:
    branches:
      - feature/email-activation-access
    paths:
      - .github/motion-engine-v2-trigger.txt

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/email-activation-access

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Apply physical sensor and FFT motion engine
        run: python .github/scripts/upgrade_album_motion_engine.py

      - name: Commit source and remove one-shot patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/wavelength/music/ui/nowplaying/NowPlayingScreen.kt
          git rm -f .github/scripts/upgrade_album_motion_engine.py
          git rm -f .github/workflows/apply-motion-engine-v2.yml
          git rm -f .github/motion-engine-v2-trigger.txt
          git commit -m "feat: use physical orientation and FFT beat onsets for album motion"
          git push origin HEAD:feature/email-activation-access

      - name: Build the exact patched branch head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-apk.yml --repo "$GITHUB_REPOSITORY" --ref feature/email-activation-access
