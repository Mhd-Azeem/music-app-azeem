name: Apply Up Next Screenshot Fix
on:
  push:
    paths:
      - '.github/up-next-screenshot-fix-trigger.txt'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
      - run: python .github/scripts/fix_up_next_screenshot.py
      - name: Commit and cleanup
        run: |
          rm -f .github/scripts/fix_up_next_screenshot.py .github/workflows/apply_up_next_screenshot_fix.yml .github/up-next-screenshot-fix-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: clean up glass Up Next arc' || exit 0
          git push origin HEAD:feature/email-activation-access
