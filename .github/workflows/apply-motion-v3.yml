name: Apply Spatial Motion V3

on:
  push:
    branches:
      - feature/email-activation-access
    paths:
      - .github/motion-v3-trigger.txt

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/email-activation-access
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply spatial motion and beat reliability patch
        run: python .github/scripts/tune_motion_v3.py
      - name: Commit source changes and clean temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/wavelength/music/ui/nowplaying/NowPlayingScreen.kt \
                  app/src/main/java/com/wavelength/music/playback/VisualizerController.kt \
                  app/src/main/AndroidManifest.xml
          git rm -f .github/scripts/tune_motion_v3.py .github/workflows/apply-motion-v3.yml .github/motion-v3-trigger.txt
          git commit -m "feat: stronger spatial parallax and reliable real-audio beat bounce"
          git push origin HEAD:feature/email-activation-access
      - name: Build exact patched branch head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-apk.yml --ref feature/email-activation-access
