name: Apply Saturn Glass Controls

on:
  push:
    branches:
      - feature/email-activation-access
    paths:
      - '.github/scripts/saturn-glass-controls.py'
      - '.github/workflows/apply-saturn-glass-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
          fetch-depth: 0
      - name: Apply Saturn glass controls patch
        run: python .github/scripts/saturn-glass-controls.py
      - name: Commit source changes and clean helper files
        run: |
          rm -f .github/scripts/saturn-glass-controls.py .github/workflows/apply-saturn-glass-controls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Saturn glass playback controls"
          git push origin feature/email-activation-access
