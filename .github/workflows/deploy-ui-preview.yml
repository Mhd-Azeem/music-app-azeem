name: Deploy UI Preview

on:
  push:
    branches:
      - feature/email-activation-access
    paths:
      - 'preview/**'
      - '.github/workflows/deploy-ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply staged designer patch if present
        shell: bash
        run: |
          if [ -f preview/pending_designer_patch.py ]; then
            python preview/pending_designer_patch.py
            git rm preview/pending_designer_patch.py
            echo "AZMUSIC_DESIGNER_PATCH_APPLIED=1" >> "$GITHUB_ENV"
          fi

      - name: Prepare static preview
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/preview
          cp -R preview/. _site/preview/
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./preview/">
            <title>AzMusic UI Preview</title>
          </head>
          <body>
            <p><a href="./preview/">Open AzMusic UI Preview</a></p>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Persist designer patch
        if: env.AZMUSIC_DESIGNER_PATCH_APPLIED == '1'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/shape-editor.html
          git commit -m 'design: add erase and vector shape operations'
          git fetch origin feature/email-activation-access
          git rebase origin/feature/email-activation-access
          git push origin HEAD:feature/email-activation-access
