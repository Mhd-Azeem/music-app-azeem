name: Apply Playback Polish

on:
  push:
    branches:
      - feature/email-activation-access
    paths:
      - '.github/playback-polish-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply playback feature updates
        run: python .github/scripts/playback_polish.py
      - name: Commit feature batch and clean helper files
        run: |
          rm -f .github/workflows/apply-playback-polish.yml
          rm -f .github/playback-polish-trigger.txt
          rm -f .github/scripts/playback_polish.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: polish smart queue gapless crossfade and swipe playback' || exit 0
          git push origin HEAD:feature/email-activation-access
