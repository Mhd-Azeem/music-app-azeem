name: Apply Circular Up Next Once
on:
  push:
    paths: ['.github/circular-upnext-once.txt']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/email-activation-access
      - run: python .github/scripts/fix_continuous_circular_upnext.py
      - name: Commit and self-clean
        run: |
          rm -f .github/scripts/fix_continuous_circular_upnext.py .github/workflows/apply_circular_upnext_once.yml .github/circular-upnext-once.txt .github/build-edge-to-edge.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make Up Next follow continuous circular timeline'
          git push origin HEAD:feature/email-activation-access
