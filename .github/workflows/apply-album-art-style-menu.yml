name: Apply Album Art Style Menu

on:
  push:
    branches:
      - feature/email-activation-access
    paths:
      - .github/scripts/apply_album_art_style_menu.py
      - .github/workflows/apply-album-art-style-menu.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-activation-access
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply album art style migration
        run: python .github/scripts/apply_album_art_style_menu.py

      - name: Verify old settings API is gone
        run: |
          ! grep -R "setBeatBounceAlbumArt\|settings\.beatBounceAlbumArt" app/src/main/java
          ! grep -R "settings\.vinylStyleAlbumArt\|settings\.parallaxAlbumArt" app/src/main/java

      - name: Commit source changes and clean temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_album_art_style_menu.py .github/workflows/apply-album-art-style-menu.yml
          git add app/src/main/java
          git commit -m "feat: add album art style selector with depth bass and spatial modes"
          git push origin HEAD:feature/email-activation-access

      - name: Build exact patched branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref feature/email-activation-access
