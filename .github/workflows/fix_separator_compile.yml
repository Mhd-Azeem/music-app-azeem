name: Fix Separator Compile
on:
  push:
    paths:
      - '.github/fix-separator-compile-trigger.txt'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/email-activation-access
      - run: python .github/scripts/fix_separator_imports.py
      - name: Commit fix and cleanup
        run: |
          rm -f .github/scripts/fix_separator_imports.py .github/workflows/fix_separator_compile.yml .github/fix-separator-compile-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: add separator graphics imports' || exit 0
          git push origin HEAD:feature/email-activation-access
